name: Signed provider release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    environment: terraform-registry
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a tested commit
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          if [[ "$EVENT" == workflow_dispatch ]]; then
            test "$GITHUB_REF" = refs/heads/develop
            branch=develop
          else
            [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
            branch=master
          fi
          commit="$(git rev-parse HEAD)"
          test "$commit" = "$(git rev-parse "origin/$branch")"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=$branch&event=push&head_sha=$commit&status=success" --jq '.workflow_runs | any(.conclusion == "success")' | grep -qx true
      - name: Require release signing configuration
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [[ -z "$GPG_PRIVATE_KEY" || "$GPG_PRIVATE_KEY" == PLACEHOLDER_* ]]; then
            echo 'Replace GPG_PRIVATE_KEY in the terraform-registry environment before releasing. Never commit signing material.'
            exit 1
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
      - name: Import release signing key
        id: gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
      - name: Create signed draft release
        if: github.event_name == 'push'
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --clean --parallelism 2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GPG_FINGERPRINT: ${{ steps.gpg.outputs.fingerprint }}
      - name: Build signed snapshot without publishing
        if: github.event_name == 'workflow_dispatch'
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --snapshot --clean --skip=publish --parallelism 2
        env:
          GPG_FINGERPRINT: ${{ steps.gpg.outputs.fingerprint }}
      - name: Verify signature and packaged checksums
        env:
          GPG_FINGERPRINT: ${{ steps.gpg.outputs.fingerprint }}
        run: |
          sums=(dist/*_SHA256SUMS)
          test "${#sums[@]}" -eq 1
          test -s "${sums[0]}.sig"
          test "$(wc -l < "${sums[0]}")" -eq 7
          manifest="${sums[0]%_SHA256SUMS}_manifest.json"
          cp terraform-registry-manifest.json "$manifest"
          gpg --batch --armor --export "$GPG_FINGERPRINT" > dist/signing-public-key.asc
          verify_home="$(mktemp -d)"
          chmod 700 "$verify_home"
          trap 'rm -rf "$verify_home"' EXIT
          gpg --homedir "$verify_home" --batch --quiet --import dist/signing-public-key.asc
          gpg --homedir "$verify_home" --batch --verify "${sums[0]}.sig" "${sums[0]}"
          (cd dist && sha256sum --check "$(basename "${sums[0]}")")
          printf 'Verified signing key: %s\n' "$GPG_FINGERPRINT" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload signed snapshot for inspection
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-provider-snapshot
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          path: |
            dist/*.zip
            dist/*_SHA256SUMS
            dist/*_SHA256SUMS.sig
            dist/*_manifest.json
            dist/signing-public-key.asc
